name: Sync Canva portfolio
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: canva-portfolio-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: claude/esim-phone-network-idg4ui
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:portfolio
      - run: npm run sync:portfolio
      - name: Commit complete portfolio update
        id: update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/images/portfolio-current lib/data/portfolioManifest.json
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'Update portfolio from Canva automatically'
            git push origin HEAD:claude/esim-phone-network-idg4ui
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN commits do not trigger push workflows; dispatch explicitly.
      - name: Publish updated book
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref claude/esim-phone-network-idg4ui
