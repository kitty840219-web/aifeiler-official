案。無論是品牌形象官網、產品銷售一頁式，或是客製化 Web 介面，都能依品牌需求規劃，幫企業建立更有吸引力的數位門面。\",\"從視覺設計、內容結構到互動體驗，會先理解品牌想說的故事，再將它做成好看、好用，也方便後續維護的網站。\",\"想了解更多或預約諮詢，歡迎加入官方 LINE 洽詢。LINE ID：@153yhemn。\"],\"link\":{\"href\":\"https://lin.ee/9wCw26N\",\"label\":\"加入官方 LINE 諮詢 →\"}},{\"id\":\"quote-failure-first-step\",\"title\":\"失敗，是比成功更可貴的經歷\",\"date\":\"2026-10-01\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-failure-first-step.webp\",\"heroImage\":\"/images/articles/quote-failure-first-step.webp\",\"excerpt\":\"不用畏懼一時的失敗，它會是成功路上的最佳養分，更紀錄下我們跨出第一步的勇氣。\",\"body\":[\"凡走過必留痕跡。曾經努力過的身影也是如此。\",\"我們都不喜歡失敗的滋味，但不可否認，或許我們從這樣寶貴的經驗當中會學習到更多。\",\"不用畏懼一時的失敗，它會是成功路上的最佳養分，更紀錄下我們跨出第一步的勇氣。\",\"#自我成長 #金句語錄 #語錄分享 #勇敢跨出第一步 #失敗為成功之母\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1J3o5PN7Ng/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-accepting-goodbye\",\"title\":\"不是不想念了，只是終於接受\",\"date\":\"2026-09-19\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-accepting-goodbye.webp\",\"heroImage\":\"/images/articles/quote-accepting-goodbye.webp\",\"excerpt\":\"我們的故事適合被記得，卻不適合再繼續。\",\"body\":[\"在人生的旅途中，我們總會遇見幾個人，他們的出現像是一場突如其來的暴雨，既打亂了原本的平靜，卻也滋潤了心底最深處的土壤。\",\"那段時間，我們習慣了彼此的溫度，分享過深夜的秘密，甚至以為這份連結會一直延續下去。然而，命運的轉折往往比想像中更輕巧也更殘酷。不知從何時開始，訊息的回覆越來越慢，空氣中的沉默越來越重，最後，關係在沒有正式告別的安靜中，走向了斷聯。\",\"剛開始的時候，內心總充滿了不甘與拉扯。我們反覆檢視過去的對話，試圖在每一個眼神與細節裡，尋找「是不是自己做錯了什麼」的答案。我們甚至會勇敢地試圖回頭，想要去觸碰那個熟悉的舊環境、舊身影，寄望著時間能撫平過去的僵局與傷痕。\",\"但慢慢地，我們終究會在一次次的冷漠、防備與距離感中清醒過來。原來，有些門一旦關上，就真的不必再強行推開；有些人一旦錯過，強求重逢只會讓彼此更加疲憊。\",\"承認「回不去了」，並不是一種懦弱，而是一場深度的覺醒。\",\"我們之所以還會想念，並不是因為自己不夠堅強，而是因為我們曾經全心全意地投入過。那些一起走過的路、感受過的善意與遺憾，都是真實存在過的痕跡。我們不需要刻意去否定過去，也不需要逼迫自己立刻撕掉所有回憶。允許自己偶爾懷念，那是對曾經重情重義的自己，一份最坦然的尊重。\",\"過客之所以稱為過客，是因為他們的使命只是陪我們走過某一程特定的風景，教會我們如何去愛、如何面對失望，然後轉身離去。\",\"當我們終於願意收回期盼的目光，不再把喜怒哀樂寄托在對方的回應上時，才會發現——原來主導權一直都在自己手裡。把過去留給回憶，把界線還給彼此，騰出充滿疑慮與焦慮的雙手，我們才能在未來的日子裡，坦然地擁抱真正屬於自己的陽光與自由。\",\"謝謝你曾來過我的世界，但這一次，我要一個人勇敢地往前走了。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/18kpkiXifm/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-life-is-change\",\"title\":\"人生唯一不變的，就是變。\",\"date\":\"2026-08-29\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-life-is-change.webp\",\"heroImage\":\"/images/articles/quote-life-is-change.webp\",\"excerpt\":\"真正重要的，不是祈禱人生永遠不要出事，而是事情發生時，我有沒有能力接住自己。\",\"body\":[\"婚姻會變、感情會變、身邊的人會變，連我們自己都一直在變。\",\"所以真正重要的，從來不是祈禱人生永遠不要出事，而是事情發生時，我有沒有能力接住自己。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/19qofAns55/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-kindness-with-edges\",\"title\":\"善良很珍貴，但必須帶點鋒芒。\",\"date\":\"2026-08-10\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-kindness-with-edges.webp\",\"heroImage\":\"/images/articles/quote-kindness-with-edges.webp\",\"excerpt\":\"把醜話說在前面，不是難搞，而是給彼此設立最健康的安全距離。\",\"body\":[\"有時候還是得適當學會「把醜話說在前面」。這句話常被誤解為難相處或缺乏團隊精神，於是習慣把委屈往肚裡吞，總覺得默默做好、不破壞和諧就是成熟。但現實是，當一次次咬牙扛下不合理的負擔、替別人填補一個個漏洞，換來的往往不是感謝，而是理所當然的消耗。\",\"直到把困難與界線攤在陽光下，才恍然大悟，把醜話說在前面，不是難搞，而是給彼此設立最健康的安全距離。在面對資源不足、非自身專業的重擔，或是他人因思慮不周留下的爛攤子，默默承受只會傳遞出「自己很好拿捏」的訊號，讓壓力無限傾倒在自己身上。\",\"真正的成熟，是把話在事前說清楚。就像行車保持安全距離，不是為了攻擊，而是為了在狀況發生時有空間煞車，不至於互相甩鍋、撞得頭破血流。當不再害怕說實話、不再無條件吞委屈，用客觀事實把決策權交回給該負責的人，會發現，周遭的人反而學會了客氣與尊重。\",\"善良很珍貴，但必須帶點鋒芒；配合很難得，但不能以犧牲自己為代價。當不再委屈自己去填補別人的漏洞，把主動權拿回手裡，生活沒有變難，反而因為有了清晰的界線，變得乾淨、踏實而自在。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1aArMpYqkB/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-cherish-understanding\",\"title\":\"珍惜那些，真正懂得你好的人\",\"date\":\"2026-07-19\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-cherish-understanding.webp\",\"heroImage\":\"/images/articles/quote-cherish-understanding.webp\",\"excerpt\":\"不是每一份善良，都會立刻得到回報。\",\"body\":[\"不是每一份善良，都會立刻得到回報。\",\"但真正值得的人，會在很久很久以後，告訴你：「謝謝你，當時沒有放棄對我好。」\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/17EkNoPJeY/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-last-dignity\",\"title\":\"轉身，是留給這段關係最後的體面。\",\"date\":\"2026-07-13\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-last-dignity.webp\",\"heroImage\":\"/images/articles/quote-last-dignity.webp\",\"excerpt\":\"如果毫無保留的結果依然是原地踏步，那轉身，就是我能留給這段關係最後的體面。\",\"body\":[\"若有一天你看見這篇時，那就代表你和我一樣都還很在意彼此。\",\"但假如有一天我不再主動去找你，不是因為突然不在意了，而是我已經把能給的溫柔、耐心與努力，毫無保留地給了你。\",\"如果毫無保留的結果依然是原地踏步，那轉身，就是我能留給這段關係，最後的體面。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1JFw4pAMub/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-strong-by-enduring\",\"title\":\"沒人天生是強者，大家都是強行撐著。\",\"date\":\"2026-07-10\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-strong-by-enduring.webp\",\"heroImage\":\"/images/articles/quote-strong-by-enduring.webp\",\"excerpt\":\"所有的獨自升級，都只是為了在最後，能成為那個給你最真誠擁抱的人。\",\"body\":[\"披著獅子的皮，假裝無所畏懼，不是為了去征服多麼瘋狂的世界，而是在失序的現實裡，學會獨自消化、面對與反省。\",\"所有的獨自升級，都只是為了在最後，能成為那個給你最真誠擁抱的人。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1FRXxm64wL/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-comfort-zone\",\"title\":\"真正的危機，不是眼前的困難。\",\"date\":\"2026-07-06\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-comfort-zone.webp\",\"heroImage\":\"/images/articles/quote-comfort-zone.webp\",\"excerpt\":\"真正的危機，是因為太舒服，而失去了看清現實、改變自己的能力。\",\"body\":[\"最近經歷了種種現實後瞬間被打醒，決定又回去補習進修，或許人最可怕的，不是沒能力，而是有時候當待在舒適圈太久，連現實都看不清了。\",\"人一旦習慣了安逸，就像溫水裡的青蛙。水溫一點一滴升高，卻因為變化太慢，漸漸失去了警覺；生活也是如此，當一切都太舒服時，人很容易誤以為現況會永遠不變。\",\"日子久了不再學習、不再成長、不再提升自己，甚至開始聽不進別人的提醒，也看不見外面的世界早已改變。真正可怕的，不是競爭對手變強，而是自己還活在昨天，以為一切都和從前一樣。\",\"這個世界每天都在進步，你停在原地，就已經是在退步。舒適圈可以讓人休息，卻不能讓人久留。適時接受新的挑戰、學習新的能力、接觸不同的觀點，你才會發現，不是世界變得殘酷，而是自己曾經看得太少。\",\"真正的危機，不是眼前的困難，而是因為太舒服，而失去了看清現實、改變自己的能力。\",\"願我們都能保持一份清醒，不被安逸麻痺，不被習慣困住，在每一次突破中，成為更好的自己。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/19Y3UofNJ8/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-workplace-chess\",\"title\":\"在職場的賽局裡，我既是棋子，也是棋手。\",\"date\":\"2026-07-03\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-workplace-chess.webp\",\"heroImage\":\"/images/articles/quote-workplace-chess.webp\",\"excerpt\":\"看懂人性，所以能並肩作戰；看透價值，所以從不迷失方向。\",\"body\":[\"在職場的大棋盤上，我們每天都能看見兩種人。一種人像「完美的齒輪」，他們擁有極高的能力、純熟的技術，日復一日地精準運作。然而，齒輪終究是可以被複製與取代的。\",\"另一種人，則是「獨一無二的靈魂」，他們不一定事必躬親，但腦中的想法與觀點，卻是任何範本與 AI 都無法量產的珍貴資產。\",\"最近，我常常在思考，自己屬於哪一種？後來我發現，真正的強者，從不讓自己被單一標籤給框限。因為多數人進入職場，拿的是「員工思維」的劇本。計較付出的工時、抱怨不公的體制，在被動的框架裡尋求安全感。\",\"但我不同，在員工的軀殼裡，我同時裝著一個「商人」的心智。身為員工的我深諳人性，知道基層的痛點與成本，明白一條政令下去會引起什麼樣的漣漪，所以我懂得如何與人並肩作戰。但身為商人的我看透價值，不再把工作當成「拿時間換薪水」的消耗，而是當成一場「資產投資」的賽局。我在乎投報率，更在乎我的能力要如何精準地賣在最高點。\",\"這種雙重視角，讓我能用員工的雙腳踩穩大地，同時用商人的雙眼看清局勢。\",\"在職場的賽局裡，我既是下棋的棋子，也是佈局的棋手。看懂人性，所以能並肩作戰；看透價值，所以從不迷失方向。\",\"當組織需要執行力時，我可以是那顆最精準、最無懈可擊的棋子，把事情做到極致；但在心態上，我從未卸下棋手的帽子。\",\"我站在高處，冷靜地觀察每一次資源的流動、每一次利益的交換、以及每一個決策背後的底牌。\",\"我不悲觀，因為我懂遊戲規則；我也不盲目，因為我知道終點在哪。\",\"我覺得能力或許是籌碼，因為它讓你拿到入場券；但想法就像是演算法，它決定你能走多遠。\",\"在這個滿是完美齒輪的世界裡，有能力的人很多，但能看見盲點、定義方向的人卻寥寥無幾。我不擔心自己被定價，因為當你同時看懂人性與價值，你就不再只是體制下被動的生存者，而是這場職場賽局裡，那個暗中佈局、獨一無二的操盤手。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1A5vQEuHe7/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-solitude\",\"title\":\"喜歡獨處，是我對自己最溫柔的體貼。\",\"date\":\"2026-07-02\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-solitude.webp\",\"heroImage\":\"/images/articles/quote-solitude.webp\",\"excerpt\":\"最讓我感到安心的容身之處，其實是自己的內心。\",\"body\":[\"我是一個喜歡一個人的人。這並非出於孤僻，也不是對世界的抗拒，而是在無數次與人交錯的瞬間後，我終於發現，最讓我感到安心的容身之處，其實是自己的內心。\",\"我喜歡自己規劃一趟旅行，沒有妥協，只有隨心所欲的風景；我喜歡一個人逛街，不必遷就別人的步伐，停走全憑心意。當我待在屬於自己的空間裡，看一本書、聽一首歌，或僅僅只是安靜地看著窗外發呆，那種不需迎合、不需閱讀空氣的自在，是世界上最奢侈的充電方式。\",\"當然，生活總有不得不妥協的時刻。職場上的應酬、社交場合的寒暄，有時像一場突如其來的雨，總會帶給我一絲不自在與莫名的壓力。在那些時刻，我必須穿上外向的盔甲，努力扮演一個合群的社會人。\",\"說實話，我偶爾也會渴望陪伴。看到有趣的迷因、讀到觸動心弦的句子時，也會希望有個懂我的朋友能陪我聊聊天。但更多時候，當喧囂散去，我依然會深深覺得，還是回到一個人的狀態最為踏實。\",\"因為，在一個人的世界裡，我不需要去猜測別人的心思，也不用擔心自己的沉默會冷場。\",\"每個人都有自己與世界相處的頻率。別人喜歡在人群中發光，而我，只想在自己的角落裡安安靜靜地生活。喜歡獨處，是我對自己最溫柔的體貼。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1DrEyhLZ7w/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-distant-admiration\",\"title\":\"遠遠看著盛開的花就很美，不一定要摘回家。\",\"date\":\"2026-07-01\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-distant-admiration.webp\",\"heroImage\":\"/images/articles/quote-distant-admiration.webp\",\"excerpt\":\"有一種更高級的深情，叫「遠遠欣賞」。\",\"body\":[\"長大後才明白，有一種更高級的深情，叫「遠遠欣賞」。因為摘下來，它就會枯萎。\",\"很多美好的關係，一旦非要強求一個結果、一個名分，反而在現實的柴米油鹽或拉扯中，磨掉了最初的心動。因為喜歡是佔有，而愛是成全。\",\"只要看著你在你的世界裡閃閃發光、笑得燦爛，那對我來說，就是最好的結局。我的世界有沒有你，其實沒那麼重要了。\",\"因為遺憾，有時候比圓滿更深刻。得不到的，永遠在記憶裡保持著最完美的姿態。\",\"我的喜歡，與你無關。它是我心底的一場海嘯，也是我轉身時的一陣微風。\",\"把喜歡留在心裡，不是懦弱，也不是退縮。而是我用最溫柔的方式，保護了你，也保全了這份情感最初的純粹。\",\"謝謝你曾驚艷過我的時光。接下來的路，你就繼續盛開吧，而我會帶著這份美好的記憶，繼續往前走。\",\"不摘花，是因為我希望你永遠是那朵，開得最驕傲的花。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1NVZ3TMYwD/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-not-perfect\",\"title\":\"你不需要向世界證明你有多完美。\",\"date\":\"2026-06-29\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-not-perfect.webp\",\"heroImage\":\"/images/articles/quote-not-perfect.webp\",\"excerpt\":\"敢於展現脆弱的勇氣，才是真正的強大。\",\"body\":[\"你不需要向世界證明你有多完美。\",\"坦然接受自己的不完美，懂得在需要時求助，在迷茫時停下，這種敢於展現脆弱的勇氣，才是真正的強大。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1EtnEDnUFJ/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-after-levels-bloom\",\"title\":\"關卡之後，便是繁花盛開。\",\"date\":\"2026-06-23\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-after-levels-bloom.webp\",\"heroImage\":\"/images/articles/quote-after-levels-bloom.webp\",\"excerpt\":\"那些走過的路，每一步都算數；回頭望去，輕舟已過萬重山。\",\"body\":[\"人生有時候就像一場停不下來的遊戲，是一關又一關的突破。小時候總以為長大就是終點，後來才發現，長大只是拿到了更多隱藏關卡的入場券。\",\"每一次面對未知的挑戰，我們都像是一個裝備還不夠齊全的冒險者，帶著一身的青澀與笨拙，硬著頭皮往前衝。跌倒過、質疑過，也曾看著別人的耀眼，心疼起自己的不完美。\",\"過去的不足，如今都變成了最扎實的底氣。那些走過的路，每一步都算數。如果沒有經歷過那些「不夠好」的時刻，我們大概很難學會如何優雅地轉身，更無法體會關關難過關關過之後的豁然開朗。\",\"曾經的迷惘變成了現在做決定時的果斷。曾經的脆弱鍛造出如今百毒不侵的堅韌。曾經的遺憾讓我們更懂得珍惜眼前的每一個當下。\",\"原來，那些我們曾急著想掩蓋的笨拙與缺失，並不是人生的污點。它們更像是土壤裡的養分，默默地在黑暗中滋養著根系，直到有一天，撐起了一整片繁花似錦的自己。\",\"敬，此時此刻的自己。回頭望去，輕舟已過萬重山。那些過去的不足，不再是絆腳石，而是變成了一座座階梯，讓我們站得更高、看得更遠；它們也化作胸前隱形的勳章，無聲地證明著：「看啊，我真的挺過來了。」\",\"這一路上的破關斬將，你辛苦了。不需要去羨慕別人的劇本，因為你正在寫的這一本，經歷過低谷，反彈得更高，無疑是最精彩的一章。\",\"#艾飛樂 #語錄 #illustration\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1BUZvqHtWw/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-grateful-today\",\"title\":\"與其去害怕失去，不如去感謝現在擁有的這一天。\",\"date\":\"2026-06-19\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-grateful-today.webp\",\"heroImage\":\"/images/articles/quote-grateful-today.webp\",\"excerpt\":\"與其去害怕失去，不如去感謝我們現在擁有的這一天。\",\"body\":[\"與其去害怕失去，不如去感謝我們現在擁有的這一天。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1BwDxSGifH/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-tide-in-heart\",\"title\":\"我已經把想你的潮水，壓回心裡好多遍。\",\"date\":\"2026-06-16\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-tide-in-heart.webp\",\"heroImage\":\"/images/articles/quote-tide-in-heart.webp\",\"excerpt\":\"你的一句冷淡，就讓我退回岸邊。\",\"body\":[\"每個人的心中都住著一個人。你的一句冷淡，就讓我退回岸邊。\",\"可你不知道，在浪真的湧向你之前，我已經把想你的潮水，壓回心裡好多遍。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1BwDxSGifH/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-hidden-cracks\",\"title\":\"表面像一面無波的湖，底下卻藏著碎裂的光。\",\"date\":\"2026-04-22\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-hidden-cracks.webp\",\"heroImage\":\"/images/articles/quote-hidden-cracks.webp\",\"excerpt\":\"那些看不見的裂痕，仍在水底，慢慢作痛。\",\"body\":[\"表面像一面無波的湖，底下卻藏著碎裂的光。\",\"那些看不見的裂痕，仍在水底，慢慢作痛。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1CgJhRx6ER/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-tide-and-warmth\",\"title\":\"潮汐與餘溫\",\"date\":\"2026-04-17\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-tide-and-warmth.webp\",\"heroImage\":\"/images/articles/quote-tide-and-warmth.webp\",\"excerpt\":\"你是自由的，不該是一場永無止盡的守望。\",\"body\":[\"我們都曾是那座在月光下沈睡的舊港口，懷揣著一疊泛黃的信件，守著那艘早已駛離、卻又不斷在夢裡返航的老船。\",\"手裡的繩索勒出了深紅的痕跡，你以為那是命運的紅線，於是你站在礁石上，奮力揮舞著帶火的長矛，試圖擋住那些湧向遺憾的浪。\",\"但親愛的，你看那海上的迷霧正漸漸散去，那些曾讓你窒息的幽暗，不過是為了掩蓋一場即將乾涸的雨。\",\"當你終於放下了緊握的舵，不再試圖用受傷的意志去馴服整片海洋，你會發現，那份最深的眷戀，從來不是為了把你困在過去的深淵，而是為了在下一個黎明到來前，提醒你是自由的，不該是一場永無止盡的守望。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/19TE6WZ9Ef/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-cocoon\",\"title\":\"破繭\",\"date\":\"2026-04-08\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-cocoon.webp\",\"heroImage\":\"/images/articles/quote-cocoon.webp\",\"excerpt\":\"破繭，不是為了變得更強，而是願意放下防備，去觸碰仍然存在的溫柔。\",\"body\":[\"有時候，我們像被困在透明殼裡的人。外面的世界很吵，我們卻只能安靜地呼吸，學著用剛剛好的理性說話，把真正的情緒，一層一層封在裡面。\",\"你在你的殼裡，我在我的這一端。看起來靠近，其實始終隔著一層看不見的距離。\",\"我曾在人群裡看著你，看見你在兩種重量之間搖晃：一邊是責任，一邊是心。你把自己撐得很穩，像什麼都能承受；可我知道，那層殼底下，早就堆滿了無聲的疲憊。\",\"而我也是。我也曾把話收回去，把情緒吞進去，用沉默假裝自己不需要誰。只是那樣的我們，都太用力了。用力到，連靠近都變得困難。\",\"可是我記得那些殼與殼之間，曾經有一道光。很微弱，卻很真實。在最混亂的時候，還能辨認彼此的溫度，像在黑暗裡找到一點不該存在的柔軟。\",\"我一直以為，只要再靠近一點，就能碰到你。可後來才明白，不是距離太遠，而是我們都還沒準備好讓殼裂開。\",\"於是我們一邊渴望，一邊退後；一邊靠近，一邊防備。直到某一天你開始累了，我也不再那麼堅持。那些銳利的邊角，慢慢鬆動。不是因為誰贏了，而是終於承認我們都只是想被好好對待的人。\",\"於是殼開始出現裂痕，光慢慢滲進來。也許我們回不去從前，也許那些錯過，無法被時間完全修補。但在那一刻，我們終於不再躲。\",\"原來破繭，不是為了變得更強，而是願意放下防備，伸出手，去觸碰那份仍然存在的溫柔。如果你也還在那裡，那我們就一起，慢慢走出來。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1PZE5XWcgq/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"ivy-digital-portfolio\",\"title\":\"Ivy 的數位創作作品集 電子書\",\"date\":\"2026-09-11\",\"tag\":\"工具小幫手\",\"image\":\"/images/articles/ivy-digital-portfolio-cutout.webp\",\"heroImage\":\"/images/articles/ivy-digital-portfolio-dm.webp\",\"excerpt\":\"把 11 年以上的工作經歷、AI 應用、社群經營、影音與視覺設計，整理成一冊可以線上翻閱的電子作品集。\",\"body\":[\"這次，我把自己的工作經歷與創作成果整理成一份線上作品集。從國際貿易、行政與專案管理的實務背景，到數位文創、社群內容、平面設計、影片剪輯與 AI 工具應用，這些看似不同的能力，慢慢組成了現在的我。\",\"作品集中收錄艾飛樂品牌經營、Facebook 與 Instagram 成效、官方 LINE、影片剪輯與動畫、AI 真人 IP 企劃，以及電商視覺、DM、Banner、LINE 貼圖、似顏繪、客製商品等設計作品。\",\"另外也整理了 AR／VR 線上策展、互動闖關與 3D 角色建模成果，呈現我如何運用不同工具，把一個想法從企劃、素材製作一路完成到可以實際觀看與操作的成品。\",\"這份作品集採用電子書方式呈現，不需要下載檔案就能直接翻頁，也可以依照章節快速瀏覽或放大觀看，希望讓每位面試主管都能更清楚地看見我的能力與工作方式。\"],\"link\":{\"href\":\"/portfolio\",\"label\":\"翻閱完整電子作品集 →\"}},{\"id\":\"accounting-helper-launch\",\"title\":\"艾飛樂會計小幫手上線了！\",\"date\":\"2026-09-09\",\"tag\":\"工具小幫手\",\"image\":\"/images/articles/accounting-helper-cutout.webp\",\"heroImage\":\"/images/articles/accounting-helper-dm.webp\",\"excerpt\":\"把接案、周邊、占卜服務的記帳難題，變成點兩下就能算完的小事。\",\"body\":[\"經營工作室這幾年，我發現插畫接案跟開店最頭痛的，往往不是畫圖，而是後面那一堆數字：這張圖報價多少才划算？平台抽成扣一扣還剩多少利潤？發票要開多少稅額？勞健保又該怎麼算？\",\"所以我做了「艾飛樂會計小幫手」，把這些常常卡住我的問題，整理成一頁就能用的工具站。\",\"裡面有 8 個小幫手：利潤小幫手、成本小幫手、分潤小幫手、發票小幫手、營業稅小幫手、薪資小幫手、勞健保小幫手，還有帶你一步步了解流程的公司設立小幫手。輸入數字，馬上看到結果，不用再拿計算機慢慢按。\",\"首頁還有一個 AI 問答框，遇到不知道怎麼算、或想先了解方向的問題，都可以直接問我；如果是比較複雜的勞資或法規問題，也會幫你指向對應的官方網站（勞動部、勞保局、健保署等），不用自己大海撈針。\",\"所有試算都只是參考，正式金額還是要以帳務資料為準；遇到特殊情況，也建議再找專業會計師確認。但日常那些「先抓個大概」的計算，現在艾飛樂可以幫你一起算了。\"],\"link\":{\"href\":\"/accounting\",\"label\":\"前往會計小幫手 →\"}},{\"id\":\"service-rate-card-launch\",\"title\":\"影片剪輯與平面設計，2026 服務報價\",\"date\":\"2026-09-10\",\"tag\":\"服務資訊\",\"image\":\"/images/articles/service-rate-card.jpg\",\"heroImage\":\"/images/articles/service-rate-card.jpg\",\"excerpt\":\"接案價格到底怎麼算？這次把插畫、剪輯、設計的報價全部攤開來給你看，還能線上試算。\",\"body\":[\"常常有人私訊問我：「畫一張語錄圖卡大概多少錢？」「剪一支影片要抓多久？」每次都要重新報價、來回溝通，說真的蠻花時間的，你我都是。\",\"所以這次我把語錄插畫設計、短影音剪輯、平面設計、AI 短影音等服務的價格，整理成一頁「服務報價單」公開給大家看，照 2026 年接案行情定價，報價公開沒有隱藏加購，初稿確認後也提供 2 次免費修改。\",\"最方便的是最上面那個「自動報價試算」——不用等我回覆，自己選需要的項目跟數量，就能馬上看到預估金額，喜歡的話可以直接透過 LINE 把試算結果送出來詢問，省掉來回對報價的時間。\",\"如果你也在想「這個服務大概多少錢」，歡迎直接進去點點看，有任何問題也可以直接跟我聊聊 💬\"],\"link\":{\"href\":\"/pricing\",\"label\":\"查看服務報價 →\"}},{\"id\":\"tarot-service-menu-launch\",\"title\":\"塔羅占卜服務項目更新了\",\"date\":\"2026-09-10\",\"tag\":\"服務資訊\",\"image\":\"/images/articles/tarot-service-pricing.jpg\",\"excerpt\":\"一次占卜、5 個問題，指引方向、看見答案；單次服務跟 VIP 包月方案這次一次整理給你看。\",\"body\":[\"很多人第一次找我占卜，都會問：「我只是想問一個問題，也可以嗎？」「如果想常常來問，有沒有比較划算的方案？」這次把大家常問的整理成一頁服務項目，單次到長期都有對應的選擇。\",\"單次服務的部分：單題占卜 $400／1 個問題；套餐占卜 $1000／5 個問題（限問一主題、不追加）；另外還有比較輕量的字卡訊息、正念卡各 $300，適合想快速抓一個方向、或單純想抽張卡看看現在的自己在想什麼的人。\",\"如果想要比較長期的陪伴，這次也推出 VIP 包月方案：Light VIP（輕療癒）$2999／月，每月可占卜 3 次；Healing VIP（深度療癒）$4999／月，每月 6 次、還有每月運勢分析；Premium VIP（專屬陪伴）$7999／月，每月 9 次、優先回覆、專屬陪伴解析。適合正在經歷感情、工作轉折，需要持續追蹤與陪伴的人。\",\"所有服務預約後 48 小時內回覆，以文字解析為主，忙碌時也會依序回覆，不會漏掉你的提問。想看完整服務內容與價格，歡迎直接進塔羅占卜頁面看看 🔮\"],\"link\":{\"href\":\"/tarot\",\"label\":\"查看塔羅占卜服務 →\"}},{\"id\":\"tarot-testimonials-update\",\"title\":\"塔羅占卜客戶回饋心得分享\",\"date\":\"2026-09-10\",\"tag\":\"服務資訊\",\"image\":\"/images/articles/tarot-testimonials-feedback.jpg\",\"excerpt\":\"每一則留言都認真看過，也整理成一頁分享給還在猶豫的你，看看其他人怎麼說。\",\"body\":[\"占卜這件事很私人，很多人第一次來之前，都會猶豫：「這真的準嗎？」「花這筆錢值得嗎？」比起我自己說再多，不如讓真的來過的人告訴你。\",\"這次把過去收到的客戶回饋整理成一頁，裡面有 31 則真實留言，很多人分享自己容易內耗、負面情緒一來就想很多，透過占卜把混亂的心情梳理出方向，也有人特別提到回應速度快、建議務實不會太直接冷冰冰，聽完會覺得心情鬆了不少。\",\"也有人提到，之前找過算命老師，講話比較直接、聽完反而壓力更大，花錢買心情差更糟糕；相比之下希望艾飛樂的占卜能給的是陪伴跟具體方向，而不是單純的斷言。\",\"這些留言我都一則一則看過，也是每次接下一張牌前，提醒自己要更用心的原因。如果你也想知道占卜是不是適合現在的你，歡迎進頁面看看其他人的真實回饋，也可以直接到 Google 評論看更完整的內容 💌\"],\"link\":{\"href\":\"/tarot\",\"label\":\"查看客戶真實回饋 →\"}},{\"id\":\"quote-new-beginning\",\"title\":\"新的開始，從改變自己開始。\",\"date\":\"2026-03-29\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-new-beginning.webp\",\"heroImage\":\"/images/articles/quote-new-beginning.webp\",\"excerpt\":\"如果還帶著舊有的習慣與情緒，回頭不過是再走一次曾經走過的路。\",\"body\":[\"有些人以為，只要重新開始，一切就會不一樣。但其實，如果還帶著舊有的習慣、舊有的情緒、舊有那個不敢面對自己的自己，那麼回頭，不過是再走一次曾經走過的路。\",\"那些讓人受傷的，從來不是相遇，而是沒有被改變的相處方式。我們都很努力去愛，卻忘了去學會怎麼好好愛。於是一次又一次，在同樣的地方跌倒，在同樣的問題裡迷路。\",\"直到有一天，你終於願意停下來，不再急著抓住誰，而是先看清自己。當你開始改變，開始理解、開始放下、開始長出新的樣子，那時候，新的開始才會真正出現。\"]},{\"id\":\"quote-no-one-wins\",\"title\":\"誰也沒有贏，只是在彼此的世界裡慢慢失去彼此。\",\"date\":\"2026-03-24\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-no-one-wins.webp\",\"heroImage\":\"/images/articles/quote-no-one-wins.webp\",\"excerpt\":\"其實我們都懂對方想要的是什麼，只是誰也不願意先退一步。\",\"body\":[\"他有他的想法和感受，我有我的堅持與不安。我們都在說話，卻好像從來沒有真正聽見彼此。你不知道我要的是什麼，我也不確定你想留下還是離開。\",\"我們很像，一樣倔強、一樣不願低頭。好的時候，好到以為可以走很遠；壞的時候，卻傷得連回頭都覺得累。\",\"其實我們都懂，對方想要的是什麼。只是誰也不願意，先退一步。於是愛變成了拉扯，靠近變成了對抗，到最後，誰也沒有贏。只剩下兩個人，在彼此的世界裡，慢慢失去彼此。\"],\"link\":{\"href\":\"https://www.facebook.com/aibi0219/posts/pfbid0BPw8xhF4td4r7haQzR5EJyrwMvxDs35AFdfuJqcjZQ7AWc815XxBvi6XMwLWy1s8l\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-tenderness-and-indifference\",\"title\":\"我可以給你全世界的溫柔，也可以給你全世界的冷漠。\",\"date\":\"2026-03-16\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-tenderness-and-indifference.webp\",\"heroImage\":\"/images/articles/quote-tenderness-and-indifference.webp\",\"excerpt\":\"如果你不珍惜，我也可以給你全世界的冷漠。\",\"body\":[\"我可以給你全世界的溫柔，但如果你不珍惜，我也可以給你全世界的冷漠。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1DZyo3ivqT/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-countdown-to-leaving\",\"title\":\"我們其實早就站在離開的路上。\",\"date\":\"2026-03-09\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-countdown-to-leaving.webp\",\"heroImage\":\"/images/articles/quote-countdown-to-leaving.webp\",\"excerpt\":\"有些離開從來不是突然發生的，它其實早就悄悄開始倒數了。\",\"body\":[\"明知道不會有結果，明知道這可能是一場錯誤。原以為自己已經做好心理準備，隨時都能抽身離開。可當一切真正開始時，才發現自己還是忍不住像飛蛾一樣，一次又一次撲向那團光。\",\"有些離開，從來不是突然發生的。它其實早就悄悄開始倒數了。從訊息回得越來越慢的那一天，從沉默漸漸多過對話的那一刻，從我們都開始學會假裝沒有那麼在意的時候。\",\"時間沒有停下來等任何人，它只是很安靜地一秒一秒往前走。好像有人在心裡按下了一個看不見的倒數鍵。而我們，其實早就站在離開的路上。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/18a4stADdR/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-let-time-answer\",\"title\":\"把答案交給時間。\",\"date\":\"2026-03-05\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-let-time-answer.webp\",\"heroImage\":\"/images/articles/quote-let-time-answer.webp\",\"excerpt\":\"讓那些無法說清的情緒，慢慢沉澱，慢慢淡忘。\",\"body\":[\"人來人往的世界裡，我們早已習慣相遇與離開。只是偶爾，會有那麼一兩個意外，在毫無防備的時候，悄悄走進生命。\",\"於是開始放不下，想離開，卻又捨不得。在矛盾與糾結之間反覆猶豫、反覆拉扯，最後只能把答案交給時間。讓那些無法說清的情緒，慢慢沉澱，慢慢淡忘。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/19r3Bt2AJ6/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-facing-truth\",\"title\":\"面對真相雖然痛，但卻是復原的開始。\",\"date\":\"2026-02-28\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-facing-truth.webp\",\"heroImage\":\"/images/articles/quote-facing-truth.webp\",\"excerpt\":\"真正讓人疲憊的，從來不是答案本身，而是逃避。\",\"body\":[\"有時候，我們不是不知道真相，只是害怕承認。害怕一旦看清，那些自我安慰的幻想就會碎裂；害怕一旦誠實，就再也回不到從前的天真。\",\"可其實真正讓人疲憊的，從來不是答案本身，而是逃避。面對真相雖然痛，那種痛像冷風吹進傷口，刺得人紅了眼眶。\",\"但也正因為看清，我們才終於停止欺騙自己；也正因為承認，傷口才有機會真正癒合。有些離開，是為了不再消耗；有些清醒，是為了重新開始。痛，不代表失敗。痛，是身體在告訴你你正在復原。當你願意看見真實的那一刻，其實你已經，比昨天更勇敢了一點。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/18ywdRVwg9/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-mature-reunion\",\"title\":\"真正的復合，是成熟之後再一次選擇彼此。\",\"date\":\"2026-02-27\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-mature-reunion.webp\",\"heroImage\":\"/images/articles/quote-mature-reunion.webp\",\"excerpt\":\"真正的復合不是回到從前，而是彼此都變得更好後重新選擇彼此。\",\"body\":[\"真正的復合不是回到從前，而是彼此都變得更好後重新選擇彼此。不是因為寂寞，不是因為不甘心，更不是因為習慣了對方的存在。\",\"而是在分開的日子裡，各自學會了誠實、學會了溝通，也學會了怎麼在愛裡保護自己。你不再逃避，我不再試探。你不再冷淡，我不再慌張。\",\"當兩個人都能好好站穩自己，再伸出手的那一刻——不是回頭，而是成熟之後的再一次選擇。那樣的重逢，才值得。如果沒有重逢，也沒關係。因為真正變好的人，終究會遇見同樣成熟的愛。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1J85uyNQM7/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-push-away-but-reluctant\",\"title\":\"想把你推遠，卻捨不得。\",\"date\":\"2026-02-25\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-push-away-but-reluctant.webp\",\"heroImage\":\"/images/articles/quote-push-away-but-reluctant.webp\",\"excerpt\":\"我把你推遠不是因為不愛，而是太害怕最後被留下。\",\"body\":[\"有時候不是不在乎才把人推開，而是太在乎才會慌亂。像握著一杯溫水，明明剛好卻害怕它終究會冷，於是手指鬆開，假裝是自己不要的。\",\"我嘴上說著「那就算了吧」，心裡卻一遍一遍問：如果那天我不要那麼衝動，如果那時我多給你一點空間，是不是就不會走到沉默。\",\"人有時候很矛盾，想要被抱緊卻又先後退一步，想靠近卻又提前道別。我把你推遠不是因為不愛，而是太害怕最後被留下。可當你真的離開，我才發現，原來我推開的不是你，是那份我好不容易才遇見的溫柔。\"],\"link\":{\"href\":\"https://www.facebook.com/aibi0219/posts/pfbid0dX1L3YKa15Tw87iGzUHvmtSpvyud2vjMd6DNtypdhUTr9V5EktGdD4BgLm3q5kcSl\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-different-temperatures\",\"title\":\"那時候的快樂很真，只是我們感受著不同的溫度。\",\"date\":\"2026-02-14\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-different-temperatures.webp\",\"heroImage\":\"/images/articles/quote-different-temperatures.webp\",\"excerpt\":\"那時候的快樂很真，只是我們感受著不同的溫度。\",\"body\":[\"那時候的快樂很真，只是我們感受著不同的溫度。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1FF9XAyoS6/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-choose-happiness\",\"title\":\"很多煩惱，其實只是一念之間，所以我選快樂。\",\"date\":\"2026-01-20\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-choose-happiness.webp\",\"heroImage\":\"/images/articles/quote-choose-happiness.webp\",\"excerpt\":\"願意多做一點、少計較一點，只要心是自在的，就值得。\",\"body\":[\"人生不必太計較公平，因為真正的公平，本來就不存在。願意多做一點、少計較一點，只要心是自在的，就值得。很多煩惱，其實只是一念之間，所以我選快樂。\"],\"link\":{\"href\":\"https://www.facebook.com/share/p/1BwuKWTxJd/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-heart-shell\",\"title\":\"我的心包有一層硬殼。\",\"date\":\"2026-01-06\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-heart-shell.webp\",\"heroImage\":\"/images/articles/quote-heart-shell.webp\",\"excerpt\":\"能破殼而入的東西極其有限，所以我才不能對人一往情深。\",\"body\":[\"或許我的心包有一層硬殼，能破殼而入的東西是極其有限的。所以我才不能對人一往情深。\"],\"link\":{\"href\":\"https://www.facebook.com/aibi0219/posts/pfbid03746Qi8fZ3fw3McfRqSXeLmDdAqi3kVHoqsWarVwgmBAfmYeKoWvBA32pCc75x2KMl\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-new-year-gentleness\",\"title\":\"新年快樂，願你走的每一步都離自己更近一點。\",\"date\":\"2026-01-01\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-new-year-gentleness.webp\",\"heroImage\":\"/images/articles/quote-new-year-gentleness.webp\",\"excerpt\":\"在害怕的時候，還願意慢慢往前走，那就已經很好了。\",\"body\":[\"這一年，我們沒有一定要變得多厲害，也沒有一定要馬上想清楚方向。只要在害怕的時候，還願意慢慢往前走，那就已經很好了。\",\"願新的一年，你能被世界溫柔對待，也能在某些安靜的時刻，學會抱緊自己。新年快樂，願你走的每一步，都離自己更近一點。\"],\"link\":{\"href\":\"https://www.facebook.com/share/v/1JuuQsRSKy/\",\"label\":\"前往 Facebook 原貼文 →\"}},{\"id\":\"quote-right-place\",\"title\":\"世界很大，位置站對了，很多事情自然會鬆開。\",\"date\":\"2025-12-25\",\"tag\":\"最新語錄\",\"image\":\"/images/articles/quote-right-place.webp\",\"heroImage\":\"/images/articles/quote-right-place.webp\",\"excerpt\":\"留下的，不是遺憾，而是一種剛剛好的安放。\",\"body\":[\"世界很大，位置站對了，很多事情自然會鬆開。留下的，不是遺憾，而是一種剛剛好的安放。有些關係走到後來，才發現真正需要調整的，從來不是距離，而是站的位置。\",\"當節奏不同、狀態不一樣，再靠近也只會彼此拉扯，於是沉默反而成了保護，而不是拒絕。曾經以為，把話說清楚就能讓事情回到原點，後來才懂，有些誤會不是語言能解決的，而是需要時間讓視角慢慢拉開。\",\"於是開始學會把重心收回來，把情緒整理好，把界線放在剛剛好的地方。不急著證明什麼，也不再勉強靠近。不是冷淡，而是理解到，真正舒服的互動，從來不需要用力維持。\",\"如果未來有一天，能在更平靜的狀態下再次對話，那會是一種成熟之後的相遇；如果沒有，也能帶著尊重，各自把路走穩。不是所有關係都需要一個結果，有些存在，本身就已經完成了它的意義。\"],\"link\":{\"href\":\"https://www.facebook.com/share/v/1GZQ3j7ifQ/\",\"label\":\"前往 Facebook 原貼文 →\"}}]}]}]]}]]}],[\"$L1a\"],\"$L1b\"]}]\n21:I[97367,[\"/aifeiler-official/_next/static/chunks/215mb6p9xthk5.js\",\"/aifeiler-official/_next/static/chunks/43e_3ezyj58tb.js\",\"/aifeiler-official/_next/static/chunks/2gk3x02a3-k3y.js\"],\"OutletBoundary\"]\n23:I[27201,[\"/aifeiler-official/_next/static/chunks/215mb6p9xthk5.js\",\"/aifeiler-official/_next/static/chunks/43e_3ezyj58tb.js\",\"/aifeiler-official/_next/static/chunks/2gk3x02a3-k3y.js\"],\"IconMark\"]\n10:[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$L1c\",null,{\"children\":\"$L1d\"}],[\"$\",\"div\",null,
